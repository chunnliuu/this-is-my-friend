<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这是我的朋友</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #1a1208; overflow: hidden; }

#game-root {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  font-family: 'ZCOOL XiaoWei', serif;
}

#bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.4) 100%);
}

#title-area {
  position: absolute;
  top: 7%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
}

#title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: clamp(1.8rem, 5vw, 3.2rem);
  color: #f5e9c8;
  letter-spacing: 0.3em;
  text-shadow: 0 2px 20px rgba(0,0,0,0.9);
}

#subtitle {
  margin-top: 0.4em;
  font-size: clamp(0.55rem, 1.2vw, 0.82rem);
  color: rgba(220, 200, 150, 0.55);
  letter-spacing: 0.5em;
}

.sign-btn {
  position: absolute;
  z-index: 10;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  transition: filter 0.18s ease, transform 0.15s ease;
  transform-origin: left center;
  border-radius: 4px;
}

.sign-btn:hover {
  filter: brightness(1.3) drop-shadow(0 0 8px rgba(240,210,100,0.7));
  transform: translateX(3px);
}

.sign-btn:active {
  transform: translateX(5px) scale(0.97);
}

#btn-start {
  left: 12.3%;
  top: 28.3%;
  width: 13%;
  height: 5.2%;
}

#btn-settings {
  left: 13.9%;
  top: 37.3%;
  width: 11%;
  height: 5%;
}

#start-hint {
  position: absolute;
  bottom: 6%;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(0.52rem, 1vw, 0.7rem);
  color: rgba(220, 200, 150, 0.38);
  letter-spacing: 0.35em;
  animation: pulse 2.8s ease-in-out infinite;
  z-index: 10;
  white-space: nowrap;
}

@keyframes pulse {
  0%, 100% { opacity: 0.28; }
  50% { opacity: 0.75; }
}

#version {
  position: absolute;
  bottom: 2%;
  right: 2%;
  font-size: clamp(0.42rem, 0.8vw, 0.58rem);
  color: rgba(200,170,100,0.22);
  z-index: 10;
}

#settings-panel {
  position: absolute;
  inset: 0;
  background: rgba(8, 5, 1, 0.92);
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
}
#settings-panel.visible { display: flex; }

.settings-box {
  background: #1e1408;
  border: 1px solid #8B6030;
  border-radius: 10px;
  padding: clamp(1.5rem, 4vw, 2.5rem) clamp(2rem, 6vw, 3.5rem);
  width: min(460px, 86%);
}

.settings-title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: clamp(1.1rem, 2.8vw, 1.6rem);
  color: #f0d880;
  text-align: center;
  letter-spacing: 0.35em;
  margin-bottom: 2rem;
}

.settings-row {
  display: flex;
  align-items: center;
  margin-bottom: 1.6rem;
  gap: 14px;
}

.settings-label {
  font-size: clamp(0.8rem, 1.8vw, 1rem);
  color: #c8a060;
  width: 5.5em;
  flex-shrink: 0;
  letter-spacing: 0.12em;
}

.settings-row input[type=range] {
  flex: 1;
  accent-color: #c8a060;
  cursor: pointer;
}

.settings-val {
  font-size: clamp(0.75rem, 1.5vw, 0.9rem);
  color: #f0d880;
  width: 3em;
  text-align: right;
}

.close-btn {
  display: block;
  margin: 1.8rem auto 0;
  background: none;
  border: 1px solid #8B6030;
  border-radius: 5px;
  color: #c8a060;
  font-family: 'Ma Shan Zheng', serif;
  font-size: clamp(0.85rem, 1.8vw, 1.05rem);
  letter-spacing: 0.25em;
  padding: 0.55em 2.2em;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.close-btn:hover { background: #8B6030; color: #f0d880; }
</style>
</head>

  <div id="overlay"></div>

  <div id="title-area">
    <div id="title">这是我的朋友</div>
    <div id="subtitle">T H I S &nbsp;&nbsp; I S &nbsp;&nbsp; M Y &nbsp;&nbsp; F R I E N D</div>
  </div>

  <button class="sign-btn" id="btn-start" aria-label="开始游戏"></button>
  <button class="sign-btn" id="btn-settings" aria-label="游戏设置"></button>

  <div id="start-hint">点击木牌以继续</div>
  <div id="version">Demo v0.1</div>

  <div id="settings-panel">
    <div class="settings-box">
      <div class="settings-title">游戏设置</div>
      <div class="settings-row">
        <span class="settings-label">BGM 音量</span>
        <input type="range" min="0" max="100" value="80" id="bgm-vol">
        <span class="settings-val" id="bgm-val">80</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">人声音量</span>
        <input type="range" min="0" max="100" value="100" id="voice-vol">
        <span class="settings-val" id="voice-val">100</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">音效音量</span>
        <input type="range" min="0" max="100" value="70" id="sfx-vol">
        <span class="settings-val" id="sfx-val">70</span>
      </div>
      <button class="close-btn" id="btn-close">返回主界面</button>
    </div>
  </div>
</div>

<script>
document.getElementById('btn-start').addEventListener('click', () => {
  alert('游戏开始！');
});
document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('settings-panel').classList.add('visible');
});
document.getElementById('btn-close').addEventListener('click', () => {
  document.getElementById('settings-panel').classList.remove('visible');
});
['bgm','voice','sfx'].forEach(id => {
  const s = document.getElementById(id+'-vol');
  const v = document.getElementById(id+'-val');
  s.addEventListener('input', () => v.textContent = s.value);
});
</script>
